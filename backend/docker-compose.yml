services:
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  init-notification-service:
    image: confluentinc/cp-kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic notifications --partitions 3 --replication-factor 1"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  fake-news-server:
    profiles: [pipeline]
    build:
      context: ..
      dockerfile: backend/services/kafka-notifications/news_stream_producer/Dockerfile
    command: ["python", "backend/services/kafka-notifications/news_stream_producer/fake_news_server.py"]
    environment:
      FAKE_NEWS_HOST: 0.0.0.0

  news-producer:
    profiles: [pipeline]
    build:
      context: ..
      dockerfile: backend/services/kafka-notifications/news_stream_producer/Dockerfile
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FAKE_NEWS_STREAM_URL: ws://fake-news-server:8765
    depends_on:
      init-notification-service:
        condition: service_completed_successfully
      fake-news-server:
        condition: service_started
    restart: unless-stopped

  email-consumer:
    profiles: [pipeline]
    build:
      context: ..
      dockerfile: backend/services/kafka-notifications/emails/Dockerfile
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      init-notification-service:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  push-consumer:
    profiles: [stubs]
    build:
      context: ..
      dockerfile: backend/services/kafka-notifications/push_notifictions/Dockerfile
    env_file: ../.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      init-notification-service:
        condition: service_completed_successfully
    restart: unless-stopped

  sms-consumer:
    profiles: [stubs]
    build:
      context: ..
      dockerfile: backend/services/kafka-notifications/sms/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      init-notification-service:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  kafka-data:
